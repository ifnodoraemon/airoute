server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_sec: 180
  write_timeout_sec: 180
  log_level: "info"

enable_fallback: true
max_retries: 3
default_timeout_seconds: 60

# 管理员凭证配置 (Administrator Credentials)
# 支持环境变量 GATEWAY_ADMIN_USER / GATEWAY_ADMIN_PASSWORD 覆盖
admin:
  username: "${GATEWAY_ADMIN_USER:-admin}"
  password: "${GATEWAY_ADMIN_PASSWORD:-admin123}"

# 认证与用户策略配置 (Authentication & Governance)
# 支持环境变量 ALLOW_REGISTRATION / REQUIRE_EMAIL_VERIFICATION / INITIAL_USER_BALANCE 覆盖
auth:
  allow_registration: true
  require_email_verification: false
  initial_user_balance: 5.0
  token_expiry_hours: 168

# Configured upstream channels (empty by default, create via Web UI or Admin API)
channels: []

# 客户端 API 访问密钥 (Client API Keys)
# 默认清空，由管理员在控制台或通过 Admin API 为下游应用按需签发
# 支持单独为特定 key 开启校验: format_validation: "strict" / "lenient" / "off"
api_keys: []

# 模型协议与内容格式校验规则 (Model Validation Governance)
# 三大协议 (OpenAI / Anthropic / Gemini) 默认不校验 ("off")，保障网关透传性能与极致兼容性。
# 仅对个别配置了规则的模型，或个别配置了 format_validation 的 API Key 单独开启校验。
# 校验级别: "off" (关闭), "lenient" (智能纠错清洗), "strict" (严格拦截返回协议标准400)
model_validation:
  default_level: "off"
  rules:
    # 示例：仅对部分特殊模型按需开启格式严格校验
    - model: "claude-*"
      protocol: "anthropic"
      level: "strict"
    - model: "o1*"
      protocol: "openai"
      level: "strict"
      disallow_temperature: true
    - model: "o3*"
      protocol: "openai"
      level: "strict"
      disallow_temperature: true

# 对象存储驱动配置 (Artifact Object Storage)
# 支持模式: "local" (本地磁盘目录，默认开箱即用) | "s3" / "rustfs" (企业级分布式对象存储)
# 支持环境变量覆盖: STORAGE_DRIVER, STORAGE_S3_ENDPOINT, STORAGE_S3_BUCKET, STORAGE_S3_ACCESS_KEY, STORAGE_S3_SECRET_KEY
storage:
  driver: "${STORAGE_DRIVER:-local}"
  local_path: "${STORAGE_LOCAL_PATH:-data/storage}"
  s3:
    endpoint: "${STORAGE_S3_ENDPOINT:-http://localhost:9000}"   # RustFS / MinIO / S3 服务端点
    bucket: "${STORAGE_S3_BUCKET:-airoute-skills}"               # 技能包存储桶
    access_key: "${STORAGE_S3_ACCESS_KEY:-rustfsadmin}"         # S3 Access Key ID
    secret_key: "${STORAGE_S3_SECRET_KEY:-rustfssecret}"         # S3 Secret Access Key
    region: "${STORAGE_S3_REGION:-us-east-1}"
    use_ssl: false
    path_style: true
    public_url_prefix: "${STORAGE_S3_PUBLIC_URL_PREFIX:-}"       # 可选的外部 CDN/直链域名


