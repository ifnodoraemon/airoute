# ==============================================================================
# Airoute 核心配置文件 (YAML)
# 标 ${VAR} 的参数均与项目根目录下的 .env 统一环境变量打通，开箱即用；
# HTTP 超时与日志级别除本文件的默认值外，还可由 GATEWAY_READ_TIMEOUT_SEC /
# GATEWAY_WRITE_TIMEOUT_SEC / GATEWAY_LOG_LEVEL 覆盖（server.go 启动时覆写，
# 因为 Compose 把本文件只读挂进容器，运维无法改文件）。
# ==============================================================================

server:
  host: "${GATEWAY_HOST:-0.0.0.0}"
  port: ${GATEWAY_PORT:-8080}
  public_url: "${PUBLIC_URL}"
  # 流式 (SSE) 响应会清除写 deadline，故 write_timeout_sec 只约束非流式响应写出；
  # 见 docs/CONFIGURATION.md 的 Timeout chain 一节。
  read_timeout_sec: ${GATEWAY_READ_TIMEOUT_SEC:-600}
  write_timeout_sec: ${GATEWAY_WRITE_TIMEOUT_SEC:-600}
  log_level: "${GATEWAY_LOG_LEVEL:-info}"

# 数据库与分布式缓存连接 (由 .env DATABASE_URL / REDIS_URL 统管)
# database_url: "${DATABASE_URL}"
# redis_url: "${REDIS_URL}"

# 管理员凭证配置 (由 .env GATEWAY_ADMIN_USER / GATEWAY_ADMIN_PASSWORD 统管)
# 生产环境务必设置强口令；启动时检测到 admin123/空口令/占位密钥会直接拒绝启动。
admin:
  username: "${GATEWAY_ADMIN_USER:-admin}"
  password: "${GATEWAY_ADMIN_PASSWORD}"

# 认证与用户策略配置 (由 .env ALLOW_REGISTRATION / INITIAL_USER_BALANCE 统管)
# 默认关闭自主注册、默认不赠送试用额度：开放注册 + 免费额度会让任何能访问
# 控制台的人自助获得一个正余额账号。需要开放时显式改为 true / 正数。
auth:
  allow_registration: false
  require_email_verification: false
  initial_user_balance: 0
  token_expiry_hours: 168

# Configured upstream channels (empty by default, create via Web UI or Admin API)
channels: []

# 客户端 API 访问密钥 (Client API Keys)
# 默认清空，由管理员在控制台或通过 Admin API 为下游应用按需签发
# 支持单独为特定 key 开启校验: format_validation: "strict" / "lenient" / "off"
api_keys: []

# 模型协议与内容格式校验规则 (Model Validation Governance)
# 三大协议 (OpenAI / Anthropic / Gemini) 默认不校验 ("off")，保障网关透传性能与极致兼容性。
# 仅对个别配置了规则的模型，或个别配置了 format_validation 的 API Key 单独开启校验。
# 校验级别: "off" (关闭), "lenient" (智能纠错清洗), "strict" (严格拦截返回协议标准400)
model_validation:
  default_level: "off"
  rules:
    # 示例：仅对部分特殊模型按需开启格式严格校验
    - model: "claude-*"
      protocol: "anthropic"
      level: "strict"
    - model: "o1*"
      protocol: "openai"
      level: "strict"
      disallow_temperature: true
    - model: "o3*"
      protocol: "openai"
      level: "strict"
      disallow_temperature: true

# 对象存储驱动配置 (Artifact Object Storage)
# 支持模式: "local" (本地磁盘目录，默认开箱即用) | "s3" / "rustfs" (企业级分布式对象存储)
# 支持环境变量覆盖: STORAGE_DRIVER, STORAGE_S3_ENDPOINT, STORAGE_S3_BUCKET, STORAGE_S3_ACCESS_KEY, STORAGE_S3_SECRET_KEY
storage:
  driver: "${STORAGE_DRIVER:-local}"
  local_path: "${STORAGE_LOCAL_PATH:-data/storage}"
  s3:
    endpoint: "${STORAGE_S3_ENDPOINT}"                          # S3 / Airoute Storage 服务端点 (由环境变量提供)
    bucket: "${STORAGE_S3_BUCKET:-airoute-skills}"               # 技能包存储桶
    access_key: "${STORAGE_S3_ACCESS_KEY}"                      # S3 Access Key ID (必须显式配置，无内置默认值)
    secret_key: "${STORAGE_S3_SECRET_KEY}"                      # S3 Secret Access Key (必须显式配置，无内置默认值)
    region: "${STORAGE_S3_REGION:-us-east-1}"
    use_ssl: false
    path_style: true
    public_url_prefix: "${STORAGE_S3_PUBLIC_URL_PREFIX:-}"       # 可选的外部 CDN/直链域名


