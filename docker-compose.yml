services:
  # ============================================================================
  # High-Availability Shared Relational Database (PostgreSQL 16)
  # Provides cluster-wide transactional consistency and eliminates SQLite file lock contention
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: airoute-postgres
    restart: always
    environment:
      - POSTGRES_USER=airoute
      - POSTGRES_PASSWORD=airoute_cluster_secret_pass_2026
      - POSTGRES_DB=airoute
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airoute -d airoute"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Performance Distributed Cache & Cluster Invalidation Broker (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: airoute-redis
    restart: always
    command: redis-server --appendonly yes --save ""
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Gateway Node 1
  # ============================================================================
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: airoute:latest
    container_name: airoute-1
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgres://airoute:airoute_cluster_secret_pass_2026@postgres:5432/airoute?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ADMIN_SECRET=airoute-cluster-admin-shared-secret-key-32b
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # High-Availability Gateway Node 2
  # ============================================================================
  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: airoute:latest
    container_name: airoute-2
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgres://airoute:airoute_cluster_secret_pass_2026@postgres:5432/airoute?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ADMIN_SECRET=airoute-cluster-admin-shared-secret-key-32b
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # High-Availability Load Balancer (Nginx with SSE stream support)
  # ============================================================================
  lb:
    image: nginx:alpine
    container_name: airoute-lb
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  postgres-data:
    driver: local
  gateway-data:
    driver: local
  redis-data:
    driver: local
