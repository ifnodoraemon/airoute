version: '3.8'

services:
  # ============================================================================
  # High-Performance Distributed Cache & Cluster Invalidation Broker (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nano-gateway-redis
    restart: always
    command: redis-server --appendonly yes --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Gateway Node 1
  # ============================================================================
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-gateway:latest
    container_name: nano-gateway-1
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================================
  # High-Availability Gateway Node 2
  # ============================================================================
  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: nano-gateway:latest
    container_name: nano-gateway-2
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================================
  # High-Availability Load Balancer (Nginx with SSE stream support)
  # ============================================================================
  lb:
    image: nginx:alpine
    container_name: nano-gateway-lb
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  gateway-data:
    driver: local
  redis-data:
    driver: local
