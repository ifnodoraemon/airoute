x-gateway-env: &gateway-env
  TZ: ${TZ:-Asia/Shanghai}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to match POSTGRES_PASSWORD}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  GATEWAY_ADMIN_SECRET: ${GATEWAY_ADMIN_SECRET:?Set a random GATEWAY_ADMIN_SECRET in .env}
  GATEWAY_ADMIN_USER: ${GATEWAY_ADMIN_USER:-admin}
  GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set a strong GATEWAY_ADMIN_PASSWORD in .env}
  # One-shot escape hatch: set to true to force the stored admin password back to
  # GATEWAY_ADMIN_PASSWORD on the next start, then remove it again. Without this
  # pass-through the variable never reaches the container and the reset silently
  # does nothing.
  GATEWAY_ADMIN_RESET: ${GATEWAY_ADMIN_RESET:-false}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  # Trial credit is opt-in: 0 means a new account starts empty unless the operator
  # explicitly configures a positive value.
  INITIAL_USER_BALANCE: ${INITIAL_USER_BALANCE:-0.0}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  # The startup credential check is fail-closed: a placeholder signing secret or
  # the shipped admin123 password refuses to boot. Local development can opt out
  # explicitly; never set this in a real deployment.
  GATEWAY_ALLOW_INSECURE_DEFAULTS: ${GATEWAY_ALLOW_INSECURE_DEFAULTS:-false}
  # Release mode drives gin and enables production-only warnings (e.g. Stripe).
  GIN_MODE: ${GIN_MODE:-release}
  # When set, GET /metrics requires "Authorization: Bearer <token>".
  GATEWAY_METRICS_TOKEN: ${GATEWAY_METRICS_TOKEN:-}
  # How long in-flight requests may finish after SIGTERM. Must cover
  # GATEWAY_DRAIN_TIMEOUT_SEC (default 120) + audit flush, and stay below the
  # service's stop_grace_period so the process is never SIGKILLed mid-drain.
  GATEWAY_SHUTDOWN_TIMEOUT_SEC: ${GATEWAY_SHUTDOWN_TIMEOUT_SEC:-135}
  # Comma-separated proxy addresses whose X-Forwarded-For is trusted. Defaults to
  # the nginx container's fixed address on the `edge` network below.
  #
  # It must name the proxy itself, not the edge subnet. Traffic published on the
  # host port reaches nginx with the bridge gateway's address (172.30.0.1) as its
  # source, which lies inside that subnet: the gateway would then read the client
  # as another trusted proxy hop, find no attributable client, and fail the
  # control plane closed with 403 - including for the host's own browser.
  # Empty = trust no forwarding header (every control-plane request then 403s,
  # because the peer is the nginx container).
  GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-172.30.0.10/32}
  # D15: control-plane access (/api/v1/admin, /app) defaults to loopback clients
  # and private clients that arrived through a trusted proxy. Set an explicit CIDR
  # list to override, or ALLOW_PUBLIC=true to opt out (not recommended).
  # ALLOWED_HOSTS optionally pins the Host header.
  GATEWAY_ADMIN_ALLOWED_IPS: ${GATEWAY_ADMIN_ALLOWED_IPS:-}
  GATEWAY_ADMIN_ALLOWED_HOSTS: ${GATEWAY_ADMIN_ALLOWED_HOSTS:-}
  GATEWAY_ADMIN_ALLOW_PUBLIC: ${GATEWAY_ADMIN_ALLOW_PUBLIC:-false}
  # Artifact storage defaults to the local driver, which writes into the
  # gateway-data volume and needs no credentials. s3/rustfs must be opted into
  # explicitly; the server then refuses to start unless the credentials below are
  # set (config.Validate), so an empty value here is not a silent downgrade.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://storage:9000}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-airoute-skills}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
  STORAGE_S3_PUBLIC_URL_PREFIX: ${STORAGE_S3_PUBLIC_URL_PREFIX:-}

# Shared build definition for both gateway replicas. The binary reports the
# version baked in at build time, so pass the same value CI publishes:
#   VERSION=$(sh scripts/build-version.sh) docker compose build
# `make docker-rebuild` resolves it automatically and restarts the replicas in
# a rolling fashion; a bare `docker compose build` falls back to the Dockerfile
# default and reports a development version.
x-gateway-build: &gateway-build
  context: .
  dockerfile: Dockerfile
  args:
    VERSION: ${VERSION:-1.1.0-dev}

# Streamed inference holds one descriptor for the downstream client and one for
# the upstream provider, plus TLS sockets, the Redis pool and the log file.
# Containers defaulted to `nofile 1024`, which capped the cluster at roughly
# 400-480 concurrent streams per replica (about 190-230 req/s at the observed
# 4.2s latency). Raising the limit has no behavioural effect; it just stops the
# process from running out of descriptors before it runs out of CPU.
# nginx workers inherit RLIMIT_NOFILE from the master, so the load balancer
# needs the same bump (worker_connections is already below this value).
x-nofile-ulimits: &nofile-ulimits
  nofile:
    soft: 65536
    hard: 65536

services:
  # ============================================================================
  # High-Availability Shared Relational Database (PostgreSQL 16)
  # Provides cluster-wide transactional consistency and eliminates SQLite file lock contention
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: airoute-postgres
    restart: always
    # Each gateway replica sizes its own pool (GATEWAY_DB_MAX_OPEN_CONNS,
    # default 25). The server ceiling has to leave room for every replica plus
    # maintenance: the previous 100 was exactly 2 replicas x 50, so a third
    # replica could never connect and `psql`/migrations had no headroom.
    command: ["postgres", "-c", "max_connections=200"]
    ulimits: *nofile-ulimits
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airoute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airoute}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airoute} -d $${POSTGRES_DB:-airoute}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Performance Distributed Cache & Cluster Invalidation Broker (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: airoute-redis
    restart: always
    command: redis-server --appendonly yes --save ""
    ulimits: *nofile-ulimits
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Gateway Node 1
  # ============================================================================
  gateway-1:
    build: *gateway-build
    image: airoute:latest
    container_name: airoute-1
    restart: always
    ulimits: *nofile-ulimits
    env_file: [.env]
    environment:
      <<: *gateway-env
      # Stable identity for this replica. Redis consumer entries (XREADGROUP) and
      # the live-stats snapshot keys are keyed by it, so pinning it here means a
      # restart or redeploy reuses the same entries instead of leaving one dead
      # consumer behind per process start.
      NODE_ID: gateway-1
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    # Two networks on purpose: `default` reaches postgres/redis and, in s3 mode,
    # the optional storage service; `edge` is the fixed-subnet network shared with
    # nginx, which is what makes GATEWAY_TRUSTED_PROXIES above attribute the real
    # client address instead of the load balancer.
    networks:
      - default
      - edge
    # Readiness (not bare liveness): Docker only exposes one health status, and the
    # rolling rebuild gate in scripts/docker-rebuild.sh polls it, so it must reflect
    # whether this replica can actually reach its database/Redis.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${GATEWAY_PORT:-8080}/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # Docker defaults to 10s, which SIGKILLs the gateway before it can finish the
    # drain window above.
    stop_grace_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The storage service is optional (profile object-storage). Requiring its
      # health here would make `docker compose up` fail in the default local-storage
      # mode, which is exactly the "works out of the box" promise this file broke.

  # ============================================================================
  # High-Availability Gateway Node 2
  # ============================================================================
  gateway-2:
    build: *gateway-build
    image: airoute:latest
    container_name: airoute-2
    restart: always
    ulimits: *nofile-ulimits
    env_file: [.env]
    environment:
      <<: *gateway-env
      # See gateway-1: the identity must stay stable across restarts so the Redis
      # consumer group and the live-stats keys describe replicas, not processes.
      NODE_ID: gateway-2
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    networks:
      - default
      - edge
    # Readiness (not bare liveness): Docker only exposes one health status, and the
    # rolling rebuild gate in scripts/docker-rebuild.sh polls it, so it must reflect
    # whether this replica can actually reach its database/Redis.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${GATEWAY_PORT:-8080}/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # Docker defaults to 10s, which SIGKILLs the gateway before it can finish the
    # drain window above.
    stop_grace_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # storage is optional (profile object-storage), see gateway-1 above.

  # ============================================================================
  # Optional S3-Compatible Object Storage (Airoute Storage, profile: object-storage)
  # Provides Apache 2.0 licensed, memory-safe, zero-GC artifact storage for Skill Bundles.
  #
  # Artifact storage defaults to the local driver (STORAGE_DRIVER=local), so this
  # service is NOT started by a plain `docker compose up`. Enable it only for the
  # s3/rustfs drivers, and provide the credentials then:
  #   STORAGE_DRIVER=s3 STORAGE_S3_ACCESS_KEY=… STORAGE_S3_SECRET_KEY=… \
  #     docker compose --profile object-storage up -d
  # Keeping it optional is what lets the default local mode boot without S3
  # credentials instead of failing interpolation.
  # ============================================================================
  storage:
    image: rustfs/rustfs:latest
    container_name: airoute-storage
    restart: always
    profiles: ["object-storage"]
    env_file: [.env]
    environment:
      RUSTFS_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-}
      RUSTFS_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-}
    expose:
      - "9000"
      - "9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Load Balancer (Nginx with SSE stream support)
  # ============================================================================
  lb:
    image: nginx:alpine
    container_name: airoute-lb
    restart: always
    ulimits: *nofile-ulimits
    ports:
      - "${GATEWAY_INGRESS_PORT:-${GATEWAY_PORT:-8080}}:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    # Only the `edge` network, with a fixed address: it is the single proxy the
    # gateway trusts (GATEWAY_TRUSTED_PROXIES defaults to this /32). Trusting the
    # whole subnet instead would also trust 172.30.0.1, the address Docker uses as
    # the source of traffic published on the host port, and every host-local
    # control-plane request would lose its client attribution (403).
    networks:
      edge:
        ipv4_address: 172.30.0.10
    depends_on:
      - gateway-1
      - gateway-2

networks:
  # nginx ↔ gateway hop. The subnet is fixed and the load balancer holds a fixed
  # address inside it (172.30.0.10), so GATEWAY_TRUSTED_PROXIES can name the proxy
  # exactly instead of trusting a range that also contains the address Docker uses
  # for traffic published on the host port.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres-data:
    driver: local
  gateway-data:
    driver: local
  redis-data:
    driver: local
  storage-data:
    driver: local
