x-gateway-env: &gateway-env
  TZ: ${TZ:-Asia/Shanghai}
  DATABASE_URL: ${DATABASE_URL:-postgres://airoute:airoute_cluster_secret_pass_2026@postgres:5432/airoute?sslmode=disable}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  GATEWAY_ADMIN_SECRET: ${GATEWAY_ADMIN_SECRET:-airoute-cluster-admin-shared-secret-key-32b}
  GATEWAY_ADMIN_USER: ${GATEWAY_ADMIN_USER:-admin}
  GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-admin123}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  INITIAL_USER_BALANCE: ${INITIAL_USER_BALANCE:-5.0}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://storage:9000}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-airoute-skills}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-airoute}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-airoute_cluster_secret_pass_2026}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
  STORAGE_S3_PUBLIC_URL_PREFIX: ${STORAGE_S3_PUBLIC_URL_PREFIX:-}

services:
  # ============================================================================
  # High-Availability Shared Relational Database (PostgreSQL 16)
  # Provides cluster-wide transactional consistency and eliminates SQLite file lock contention
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: airoute-postgres
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airoute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airoute_cluster_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-airoute}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airoute} -d $${POSTGRES_DB:-airoute}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Performance Distributed Cache & Cluster Invalidation Broker (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: airoute-redis
    restart: always
    command: redis-server --appendonly yes --save ""
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Gateway Node 1
  # ============================================================================
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: airoute:latest
    container_name: airoute-1
    restart: always
    env_file: [.env]
    environment:
      <<: *gateway-env
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${GATEWAY_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  # ============================================================================
  # High-Availability Gateway Node 2
  # ============================================================================
  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: airoute:latest
    container_name: airoute-2
    restart: always
    env_file: [.env]
    environment:
      <<: *gateway-env
    volumes:
      - gateway-data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${GATEWAY_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  # ============================================================================
  # High-Performance Distributed S3-Compatible Object Storage (Airoute Storage)
  # Provides Apache 2.0 licensed, memory-safe, zero-GC artifact storage for Skill Bundles
  # ============================================================================
  storage:
    image: rustfs/rustfs:latest
    container_name: airoute-storage
    restart: always
    env_file: [.env]
    environment:
      RUSTFS_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-airoute}
      RUSTFS_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-airoute_cluster_secret_pass_2026}
    expose:
      - "9000"
      - "9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # High-Availability Load Balancer (Nginx with SSE stream support)
  # ============================================================================
  lb:
    image: nginx:alpine
    container_name: airoute-lb
    restart: always
    ports:
      - "${GATEWAY_INGRESS_PORT:-${GATEWAY_PORT:-8080}}:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  postgres-data:
    driver: local
  gateway-data:
    driver: local
  redis-data:
    driver: local
  storage-data:
    driver: local
