{{- if not .Values.auth.existingSecret -}}
{{- $name := printf "%s-auth" (include "airoute.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "airoute.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ if and $existing (index $existing.data "admin-password") }}{{ index $existing.data "admin-password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  admin-secret: {{ if and $existing (index $existing.data "admin-secret") }}{{ index $existing.data "admin-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
