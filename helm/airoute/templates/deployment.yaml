{{- if and (or (gt (int .Values.replicaCount) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1))) (or (not .Values.database.existingSecret) .Values.persistence.enabled) -}}
{{- fail "multi-replica deployment requires database.existingSecret (PostgreSQL) and persistence.enabled=false; SQLite WAL cannot be shared across pods" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airoute.fullname" . }}
  labels:
    {{- include "airoute.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "airoute.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "airoute.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 180 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/airoute
            - -config
            - /etc/airoute/config.yaml
            - -db
            - /app/data/gateway.db
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # service.port is the single port value for this chart: the Service,
            # containerPort and probes all derive from it, so the process must
            # listen on it too. Without this the app kept listening on
            # config.server.port (8080) while kubelet probed service.port, and any
            # --set service.port=<other> left the pod permanently un-ready.
            - name: GATEWAY_PORT
              value: {{ .Values.service.port | quote }}
            # In-flight drain window after SIGTERM; keep below
            # terminationGracePeriodSeconds so kubelet never SIGKILLs mid-drain.
            - name: GATEWAY_SHUTDOWN_TIMEOUT_SEC
              value: {{ .Values.shutdownTimeoutSeconds | default 135 | quote }}
            - name: GIN_MODE
              value: "release"
            - name: GATEWAY_ALLOW_INSECURE_DEFAULTS
              value: "false"
            {{- if .Values.auth.trustedProxies }}
            - name: GATEWAY_TRUSTED_PROXIES
              value: {{ .Values.auth.trustedProxies | quote }}
            {{- end }}
            - name: GATEWAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "airoute.fullname" .)) | quote }}
                  key: admin-password
            - name: GATEWAY_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "airoute.fullname" .)) | quote }}
                  key: admin-secret
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: url
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness gates Service endpoints (and therefore rolling updates), so it
          # must reflect dependency reachability; liveness stays on the cheap /health.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/airoute
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "airoute.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "airoute.fullname" . }}-pvc
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
