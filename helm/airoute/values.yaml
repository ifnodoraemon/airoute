# Default values for airoute.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ifnodoraemon/airoute
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  # Single source of truth for the container port: it drives the Service port,
  # containerPort, both probes and the GATEWAY_PORT env var the process listens
  # on. config.server.port is kept for the embedded config file but is overridden
  # by GATEWAY_PORT, so changing only config.server.port has no effect.
  port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Persistence for SQLite database
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
  mountPath: /app/data

# Optional Secret containing key "url" with a PostgreSQL DATABASE_URL.
# Multi-replica operation also requires persistence.enabled=false and shared object storage.
database:
  existingSecret: ""

# If unset, Helm creates a Secret with random admin-password and admin-secret keys.
# Keep that Secret across upgrades. An existing Secret must contain both keys.
auth:
  existingSecret: ""

# Initial configuration file
config:
  server:
    host: "0.0.0.0"
    port: 8080
    log_level: "info"
    read_timeout_sec: 180
    write_timeout_sec: 180
  channels: []
  api_keys: []
