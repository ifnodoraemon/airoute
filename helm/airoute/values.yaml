# Default values for airoute.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ifnodoraemon/airoute
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# How long the process may take to drain in-flight requests after SIGTERM. Must be
# >= GATEWAY_DRAIN_TIMEOUT_SEC (default 120) + audit flush, and below
# terminationGracePeriodSeconds so kubelet does not SIGKILL it mid-drain.
shutdownTimeoutSeconds: 135
# Must exceed shutdownTimeoutSeconds with margin.
terminationGracePeriodSeconds: 180

service:
  type: ClusterIP
  # Single source of truth for the container port: it drives the Service port,
  # containerPort, both probes and the GATEWAY_PORT env var the process listens
  # on. config.server.port is kept for the embedded config file but is overridden
  # by GATEWAY_PORT, so changing only config.server.port has no effect.
  port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # Must not be smaller than the gateway's GATEWAY_MAX_BODY_BYTES default (64 MiB),
    # otherwise the ingress rejects payloads the gateway would have accepted.
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Persistence for SQLite database
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""
  mountPath: /app/data

# Optional Secret containing key "url" with a PostgreSQL DATABASE_URL.
# Multi-replica operation also requires persistence.enabled=false and shared object storage.
database:
  existingSecret: ""

# If unset, Helm creates a Secret with random admin-password and admin-secret keys.
# Keep that Secret across upgrades. An existing Secret must contain both keys.
auth:
  existingSecret: ""
  # Comma-separated CIDRs of trusted reverse proxies whose X-Forwarded-For is
  # honoured for client-IP based limits/logging and for the D15 control-plane guard.
  # Empty = trust none: behind an ingress every request is then attributed to the
  # ingress pod and the control plane (/api/v1/admin, /app) fails closed with 403.
  # Set this to the ingress-controller / pod CIDR (e.g. "10.0.0.0/8"); for direct
  # in-cluster access without a proxy use GATEWAY_ADMIN_ALLOWED_IPS instead.
  trustedProxies: ""
  # One-shot escape hatch: force the stored admin password back to the password in
  # the chart Secret on the next start, then set it back to false. Without this
  # pass-through the variable never reached the pod and the reset silently did
  # nothing (it only worked in the Compose stack).
  adminReset: false

# Initial configuration file. This block is rendered verbatim into config.yaml by
# configmap.yaml, so every key below can also be set with --set config.<path>=<value>.
config:
  server:
    host: "0.0.0.0"
    port: 8080
    log_level: "info"
    read_timeout_sec: 180
    write_timeout_sec: 180
    # Redis is optional here: set it when distributed rate limiting, cluster-wide
    # reload broadcasts and the shared trace/log path are required. It is a config
    # key (not a chart value) and is otherwise expected from REDIS_URL.
    # redis_url: "redis://redis-svc.default.svc.cluster.local:6379/0"
  # Artifact storage. Omitted keys keep the safe defaults: driver "local" writes
  # into the persistence volume ("data/storage"), no credentials. For shared object
  # storage across pods set driver=s3/rustfs plus endpoint/access_key/secret_key -
  # the process refuses to start when the driver is remote and a credential is
  # missing (no default credential ships):
  # storage:
  #   driver: "s3"
  #   local_path: "data/storage"
  #   s3:
  #     endpoint: "http://rustfs.default.svc.cluster.local:9000"
  #     bucket: "airoute-skills"
  #     access_key: ""        # prefer a Secret + extraEnv instead of checking this in
  #     secret_key: ""
  #     region: "us-east-1"
  #     path_style: true
  channels: []
  api_keys: []
