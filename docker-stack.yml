version: '3.8'

# ==============================================================================
# Airoute High-Availability Enterprise Docker Swarm Stack
# Multi-Node Cluster with Distributed PostgreSQL, Redis Streams Queue, and Ingress
# ==============================================================================

services:
  # ============================================================================
  # 1. Distributed Relational Database (PostgreSQL 16)
  # Provides shared transactional consistency across all gateway nodes.
  # ============================================================================
  airoute-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-airouteuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-airoutepassword}
      - POSTGRES_DB=${DB_NAME:-airoutedb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - airoute-pgdata:/var/lib/postgresql/data
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 2. Distributed Memory Broker & Log Message Queue (Redis 7 + Redis Streams)
  # Powers cluster-wide rate limiting, cache invalidation, and async log queues.
  # ============================================================================
  airoute-redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --save ""
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    volumes:
      - airoute-redisdata:/data
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 3. High-Concurrency Airoute Service (Multi-Node Replicated)
  # Zero-downtime rolling upgrades, trace ID correlation, Redis Streams log queue.
  # ============================================================================
  airoute:
    image: ${GATEWAY_IMAGE:-airoute:latest}
    environment:
      - TZ=Asia/Shanghai
      - GATEWAY_HOST=0.0.0.0
      - DATABASE_URL=postgres://${DB_USER:-airouteuser}:${DB_PASSWORD:?DB_PASSWORD must be set}@airoute-postgres:5432/${DB_NAME:-airoutedb}?sslmode=disable
      - REDIS_URL=redis://airoute-redis:6379/0
      - GATEWAY_ADMIN_SECRET=${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set to a strong random value}
      - GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD must be set to a strong random value}
      # Fail-closed credential gate (never enable the escape hatch in production).
      - GATEWAY_ALLOW_INSECURE_DEFAULTS=${GATEWAY_ALLOW_INSECURE_DEFAULTS:-false}
      # One-shot escape hatch: force the stored admin password back to
      # GATEWAY_ADMIN_PASSWORD on the next start. Swarm does not support env_file,
      # so a variable that is not listed here never reaches the container and the
      # reset silently does nothing (it only worked in the Compose stack).
      - GATEWAY_ADMIN_RESET=${GATEWAY_ADMIN_RESET:-false}
      # Artifact storage. `local` (default) writes into the airoute-data volume
      # below, so bundles survive task rebuilds; s3/rustfs must set the four
      # variables and a reachable endpoint, otherwise the server refuses to start.
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-data/storage}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-airoute-skills}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - GIN_MODE=release
      # When set, /metrics requires "Authorization: Bearer <token>".
      - GATEWAY_METRICS_TOKEN=${GATEWAY_METRICS_TOKEN:-}
      # Proxies whose X-Forwarded-For is trusted. Swarm assigns task addresses
      # dynamically, so it cannot be defaulted here. Prefer the bundled nginx task's
      # own address (pin it with a static network attachment) rather than the whole
      # overlay CIDR: routing-mesh traffic arrives from a gateway address inside that
      # CIDR, which would then be read as another proxy hop and leave the real client
      # unattributable - the D15 control plane would 403 instead of attributing.
      # Without any value every request is attributed to the nginx task and fails
      # closed with 403; use GATEWAY_ADMIN_ALLOWED_IPS for direct access instead.
      - GATEWAY_TRUSTED_PROXIES=${GATEWAY_TRUSTED_PROXIES:-}
      # D15: control-plane access (/api/v1/admin, /app) admits loopback clients and
      # private clients attributed through a trusted proxy; an explicit CIDR list
      # replaces that rule (and also admits a matching direct peer).
      - GATEWAY_ADMIN_ALLOWED_IPS=${GATEWAY_ADMIN_ALLOWED_IPS:-}
      - GATEWAY_ADMIN_ALLOWED_HOSTS=${GATEWAY_ADMIN_ALLOWED_HOSTS:-}
      - GATEWAY_ADMIN_ALLOW_PUBLIC=${GATEWAY_ADMIN_ALLOW_PUBLIC:-false}
      # In-flight drain window after SIGTERM (keep below stop_grace_period).
      - GATEWAY_SHUTDOWN_TIMEOUT_SEC=${GATEWAY_SHUTDOWN_TIMEOUT_SEC:-135}
    networks:
      - airoute-swarm-net
    # Persistent data directory: local artifact storage, the usage-spill fallback
    # and the SQLite mirror live under /app/data. Without this mount every task
    # rebuild started from the image's writable layer and lost the Skills bundles.
    volumes:
      - airoute-data:/app/data
    # Readiness, not bare liveness: Swarm removes a task from the service VIP when
    # its healthcheck fails, so it must reflect dependency reachability.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # Swarm's default is also 10s; the gateway needs the drain window above.
    stop_grace_period: 150s
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # 4. Swarm Ingress Load Balancer (NGINX with HTTP/2 & SSE Streaming)
  # Distributes ingress traffic across all gateway nodes with zero-buffering.
  # ============================================================================
  airoute-lb:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_swarm_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

configs:
  nginx_swarm_config:
    file: ./deploy/swarm/nginx-swarm.conf

networks:
  airoute-swarm-net:
    driver: overlay
    attachable: true

volumes:
  airoute-pgdata:
    driver: local
  airoute-redisdata:
    driver: local
  # Per-task local artifact storage / spill directory. A local Docker volume is
  # node-local: with a shared S3 bucket use STORAGE_DRIVER=s3 instead, since this
  # volume is not replicated across Swarm nodes.
  airoute-data:
    driver: local
