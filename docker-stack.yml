version: '3.8'

# ==============================================================================
# Airoute High-Availability Enterprise Docker Swarm Stack
# Multi-Node Cluster with Distributed PostgreSQL, Redis Streams Queue, and Ingress
# ==============================================================================

services:
  # ============================================================================
  # 1. Distributed Relational Database (PostgreSQL 16)
  # Provides shared transactional consistency across all gateway nodes.
  # ============================================================================
  airoute-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-airouteuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-airoutepassword}
      - POSTGRES_DB=${DB_NAME:-airoutedb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - airoute-pgdata:/var/lib/postgresql/data
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 2. Distributed Memory Broker & Log Message Queue (Redis 7 + Redis Streams)
  # Powers cluster-wide rate limiting, cache invalidation, and async log queues.
  # ============================================================================
  airoute-redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --save ""
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    volumes:
      - airoute-redisdata:/data
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 3. High-Concurrency Airoute Service (Multi-Node Replicated)
  # Zero-downtime rolling upgrades, trace ID correlation, Redis Streams log queue.
  # ============================================================================
  airoute:
    image: ${GATEWAY_IMAGE:-airoute:latest}
    environment:
      - TZ=Asia/Shanghai
      - GATEWAY_HOST=0.0.0.0
      - DATABASE_URL=postgres://${DB_USER:-airouteuser}:${DB_PASSWORD:?DB_PASSWORD must be set}@airoute-postgres:5432/${DB_NAME:-airoutedb}?sslmode=disable
      - REDIS_URL=redis://airoute-redis:6379/0
      - GATEWAY_ADMIN_SECRET=${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set to a strong random value}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - airoute-swarm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # 4. Swarm Ingress Load Balancer (NGINX with HTTP/2 & SSE Streaming)
  # Distributes ingress traffic across all gateway nodes with zero-buffering.
  # ============================================================================
  airoute-lb:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_swarm_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - airoute-swarm-net
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

configs:
  nginx_swarm_config:
    file: ./deploy/swarm/nginx-swarm.conf

networks:
  airoute-swarm-net:
    driver: overlay
    attachable: true

volumes:
  airoute-pgdata:
    driver: local
  airoute-redisdata:
    driver: local
