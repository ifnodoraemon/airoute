name: Publish Version Tag

on:
  workflow_run:
    workflows: ['CI Quality Gate & Automated Testing']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      retry:
        description: Retry publication for an existing tag at this exact commit
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-version-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version metadata
        run: node scripts/version.mjs --check
      - name: Create immutable version tag and dispatch publication
        uses: actions/github-script@v7
        env:
          RETRY_RELEASE: ${{ inputs.retry || false }}
        with:
          script: |
            const version = require('node:fs').readFileSync('VERSION', 'utf8').trim();
            const publish = require('./scripts/auto-release.cjs');
            await publish({ github, context, core, version, retry: process.env.RETRY_RELEASE === 'true' });
