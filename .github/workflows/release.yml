name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Binaries are only released once the quality gate has passed.
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build & Release Binaries
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: airoute-linux-amd64
          - os: linux
            arch: arm64
            artifact_name: airoute-linux-arm64
          - os: darwin
            arch: amd64
            artifact_name: airoute-darwin-amd64
          - os: darwin
            arch: arm64
            artifact_name: airoute-darwin-arm64
          - os: windows
            arch: amd64
            artifact_name: airoute-windows-amd64.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve build version
        id: version
        run: |
          build_version=$(sh scripts/build-version.sh)
          echo "value=$build_version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cross Compile ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          # The binary's banner prints its own "v", so a tag like v1.2.3 must be
          # passed as 1.2.3 or the version reads "vv1.2.3".
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${RELEASE_VERSION#v}" -o dist/${{ matrix.artifact_name }} ./cmd/airoute
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}
          else
            tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
