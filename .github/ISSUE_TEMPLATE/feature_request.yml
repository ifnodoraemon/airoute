name: ✨ 功能建议
description: 提议新能力或协议/渠道支持
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点?(先讲问题,再讲方案)
      placeholder: 当前无法……,导致……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作?协议/接口形态、配置项设计等。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过或试过的其他做法,以及为什么不够好。
  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 数据面(转发/协议转译/failover)
        - 控制面(管理台/运维 API)
        - 审计与计费
        - 新协议/新渠道接入
        - 部署与运维
        - 其他
