apiVersion: apps/v1
kind: Deployment
metadata:
  name: airoute
  namespace: default
  labels:
    app: airoute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: airoute
  template:
    metadata:
      labels:
        app: airoute
    spec:
      containers:
      - name: gateway
        image: ghcr.io/ifnodoraemon/airoute:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/airoute", "-config", "/etc/airoute/config.yaml", "-db", "/data/gateway.db"]
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: data-vol
          mountPath: /data
        - name: config-vol
          mountPath: /etc/airoute
      volumes:
      - name: data-vol
        persistentVolumeClaim:
          claimName: airoute-pvc
      - name: config-vol
        configMap:
          name: airoute-config
---
apiVersion: v1
kind: Service
metadata:
  name: airoute-svc
spec:
  type: ClusterIP
  selector:
    app: airoute
  ports:
  - port: 8080
    targetPort: 8080
