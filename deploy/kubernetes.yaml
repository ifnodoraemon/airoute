apiVersion: apps/v1
kind: Deployment
metadata:
  name: airoute
  namespace: default
  labels:
    app: airoute
spec:
  # Multi-replica deployments require centralized storage (PostgreSQL) and distributed Redis
  # For single-pod standalone SQLite mode, set replicas: 1 and mount airoute-pvc
  replicas: 3
  selector:
    matchLabels:
      app: airoute
  template:
    metadata:
      labels:
        app: airoute
    spec:
      terminationGracePeriodSeconds: 180
      containers:
      - name: gateway
        image: ghcr.io/ifnodoraemon/airoute:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/airoute", "-config", "/etc/airoute/config.yaml"]
        env:
        - name: GIN_MODE
          value: "release"
        - name: GATEWAY_PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: airoute-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: airoute-config
              key: redis-url
        - name: GATEWAY_ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: airoute-secret
              key: admin-secret
        - name: GATEWAY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airoute-secret
              key: admin-password
        - name: GATEWAY_ALLOW_INSECURE_DEFAULTS
          value: "false"
        # One-shot escape hatch: force the stored admin password back to the value in
        # this Secret on the next start (then set it back to "false"). Without this
        # pass-through the reset silently did nothing outside the Compose stack.
        - name: GATEWAY_ADMIN_RESET
          value: "false"
        # D15 control plane (/api/v1/admin, /app): the guard fails closed for peers
        # it cannot attribute to a client. Behind an ingress set the ingress/pod CIDR
        # here; for direct in-cluster access without a proxy list the caller CIDR in
        # GATEWAY_ADMIN_ALLOWED_IPS instead. Leaving both unset restricts the control
        # plane to loopback (and denies it to every other pod/curl).
        # - name: GATEWAY_TRUSTED_PROXIES
        #   value: "10.0.0.0/8"
        # - name: GATEWAY_ADMIN_ALLOWED_IPS
        #   value: "10.0.0.0/8"
        # Drain window after SIGTERM; keep below terminationGracePeriodSeconds.
        - name: GATEWAY_SHUTDOWN_TIMEOUT_SEC
          value: "135"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        # Readiness must reflect dependency reachability (Service endpoints and
        # rolling updates use it); liveness keeps the cheap /health probe.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-vol
          mountPath: /etc/airoute
      volumes:
      - name: config-vol
        configMap:
          name: airoute-config
---
apiVersion: v1
kind: Service
metadata:
  name: airoute-svc
spec:
  type: ClusterIP
  selector:
    app: airoute
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airoute-config
  namespace: default
data:
  redis-url: "redis://redis-svc.default.svc.cluster.local:6379/0"
  config.yaml: |
    server:
      port: 8080
      log_level: info
      redis_url: "redis://redis-svc.default.svc.cluster.local:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: airoute-secret
  namespace: default
type: Opaque
stringData:
  # REQUIRED: replace every placeholder with strong random values before applying.
  # The gateway refuses to start while weak/placeholder credentials remain.
  database-url: "postgres://airoute:REPLACE_WITH_STRONG_DB_PASSWORD@postgres-svc.default.svc.cluster.local:5432/airoute?sslmode=disable"
  admin-secret: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  # Required by the GATEWAY_ADMIN_PASSWORD secretKeyRef above; without this key the
  # pod fails with CreateContainerConfigError before the startup check can explain why.
  # Must be at least 8 characters and not admin123 (the signing secret above must be
  # at least 32 characters).
  admin-password: "REPLACE_WITH_STRONG_ADMIN_PASSWORD"
