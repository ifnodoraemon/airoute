# ==============================================================================
# High-Availability NGINX Ingress Configuration for Docker Swarm Multi-Node
# Resolves to Swarm VIP 'nano-gateway' with persistent keepalive & SSE support
# ==============================================================================

upstream nano_gateway_cluster {
    # In Docker Swarm, 'nano-gateway' resolves to the service Virtual IP (VIP),
    # which distributes connections across all active task replicas automatically.
    server nano-gateway:8080;
    keepalive 256;
}

# ==============================================================================
# 1. Dedicated Data Plane Virtual Host (Inference API Only)
# Domain pattern: api.*, api.nano.internal
# Strict security barrier: 403 on all /api/v1/admin/*, /workspace/, /console/ and /ui/ routes
# ==============================================================================
server {
    listen 80;
    server_name api.nano.internal ~^api\..+$;

    # Security Barrier: Block Control Plane endpoints from inference traffic
    location ~* ^/(api/v1/admin|workspace|console|ui) {
        return 403 '{"error":{"message":"Access Denied: Control Plane management endpoints are restricted to the management console domain.","type":"security_error","code":"forbidden_domain"}}\n';
        add_header Content-Type application/json;
    }

    # Data Plane Inference Endpoints (/v1/chat/completions, /v1/models, /v1/messages, etc.)
    location / {
        proxy_pass http://nano_gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for LLM real-time SSE streaming tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ==============================================================================
# 2. Dedicated Control Plane Virtual Host (Console & Admin API Only)
# Domain pattern: console.*, admin.*, console.nano.internal
# ==============================================================================
server {
    listen 80;
    server_name console.nano.internal admin.nano.internal ~^(console|admin)\..+$;

    # Redirect root to Web Workspace
    location = / {
        return 302 /workspace/;
    }

    location / {
        proxy_pass http://nano_gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ==============================================================================
# 3. Default Catch-All Host (Direct IP / Swarm Ingress Access)
# Enables zero-configuration testing via NodePort or direct IP
# ==============================================================================
server {
    listen 80 default_server;
    server_name localhost _;

    location / {
        proxy_pass http://nano_gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve unbuffered streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
