# ==============================================================================
# High-Availability NGINX Ingress Configuration for Docker Swarm Multi-Node
# Resolves to Swarm VIP 'airoute' with persistent keepalive & SSE support
# ==============================================================================

# The edge is the authority for the client-facing scheme. A client-supplied
# X-Forwarded-Proto is never forwarded: the gateway sits behind this proxy, it is
# listed in GATEWAY_TRUSTED_PROXIES, and it trusts that header to decide whether a
# session cookie needs the Secure flag. Echoing a client value would let anyone
# make a TLS session's cookie downgrade to non-Secure.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $scheme;
}

# Same rule for the host: report the host this proxy was reached with, not one the
# client typed into a header.
map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_host;
}

upstream airoute_cluster {
    # In Docker Swarm, 'airoute' resolves to the service Virtual IP (VIP),
    # which distributes connections across all active task replicas automatically.
    server airoute:8080;
    keepalive 256;
}

# Request body limits for large prompts, multimodal vision, and audio payloads.
# Must not be smaller than the gateway's GATEWAY_MAX_BODY_BYTES (64 MiB).
client_max_body_size 64m;
client_body_buffer_size 10m;
client_body_timeout 30s;

# ==============================================================================
# Control-plane exposure
# The Host-based split below (api.* gets a 403 for /api/v1/admin and /app) is a
# routing convenience, NOT a security boundary: clients control the Host header
# and can also reach the default vhost by IP. In Swarm the real controls are the
# published port (`ports:` in docker-stack.yml), node firewalls / VPN, and the
# gateway's own authentication and admin authorization.
# ==============================================================================

# ==============================================================================
# 1. Dedicated Data Plane Virtual Host (Inference API Only)
# Domain pattern: api.*, api.airoute.internal
# 403 on /api/v1/admin/* and /app/ for this Host only. Routing convenience -
# not a security boundary (see the control-plane exposure note above).
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.airoute.internal ~^api\..+$;

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 64MB edge proxy limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    # Security Barrier: Block Control Plane endpoints from inference traffic
    location ~* ^/(api/v1/admin|app) {
        return 403 '{"error":{"message":"Access Denied: Control Plane management endpoints are restricted to the management console domain.","type":"security_error","code":"forbidden_domain"}}\n';
        add_header Content-Type application/json;
    }

    # Data Plane Inference Endpoints (/v1/chat/completions, /v1/models, /v1/messages, etc.)
    location / {
        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        # Critical for LLM real-time SSE streaming tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ==============================================================================
# 2. Dedicated Control Plane Virtual Host (Console & Admin API Only)
# Domain pattern: console.*, admin.*, console.airoute.internal
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name console.airoute.internal admin.airoute.internal ~^(console|admin)\..+$;

    # Redirect root to Web App
    location = / {
        return 302 /app/;
    }

    # D15: same network boundary as the default vhost below. The console/admin Host
    # pattern is matched by anyone who sets the header, so it can never be the only
    # path to /api/v1/admin - the edge must apply the allow/deny list here too.
    location ~ ^/(api/v1/admin|app)(/|$) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        allow fd00::/8;
        deny all;

        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ==============================================================================
# 3. Default Catch-All Host (Direct IP / Swarm Ingress Access)
# Enables zero-configuration testing via NodePort or direct IP
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 64MB edge proxy limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    # D15: the default vhost serves the console and /api/v1/admin by design (direct
    # IP / NodePort access), so the edge must restrict that surface to
    # loopback/private clients. Defence in depth only - the gateway enforces the same
    # policy behind the proxy; this used to be missing entirely from this file.
    location ~ ^/(api/v1/admin|app)(/|$) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        allow fd00::/8;
        deny all;

        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        # Preserve unbuffered streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
