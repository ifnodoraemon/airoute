# ============================================================================
# High-Availability Gateway Cluster Upstream & Edge Download Cache
# ============================================================================
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=gateway_cache:10m max_size=500m inactive=24h use_temp_path=off;

# Request body limits for large prompts, multimodal vision, and audio payloads
client_max_body_size 50m;
client_body_buffer_size 10m;
client_body_timeout 30s;

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

upstream gateway_cluster {
    least_conn;
    server gateway-1:8080 max_fails=2 fail_timeout=10s;
    server gateway-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 256;
}

# ============================================================================
# Control-plane exposure (read this before relying on the api.* block below)
#
# Splitting traffic by Host header is a ROUTING convenience, not a security
# boundary: any client can send a different Host (or simply connect to the host
# IP / localhost), which is why the default vhost further down intentionally
# keeps serving the console and /api/v1/admin. That is what makes
# `http://127.0.0.1:8080` work out of the box.
#
# The real controls are network-level:
#   1) bind the published port to loopback only, e.g. in docker-compose.yml
#        ports: ["127.0.0.1:8080:80"]
#   2) or restrict the published port to a VPN / firewall allowlist;
#   3) or serve the console on a separate internal listener.
# The gateway still enforces authentication and admin authorization on every
# /api/v1/admin request - this file only decides who may reach them.
# ============================================================================

# ============================================================================
# 1. Dedicated Data Plane Virtual Host (Inference API Only)
# Host domain: api.airoute.internal, api.*
# Blocks /api/v1/admin/* and /app/ for this Host only. Routing convenience - not a
# security boundary (see the control-plane exposure note above).
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.airoute.internal ~^api\..+$;

    # Security Barrier: Block Control Plane endpoints from the inference domain
    location ~* ^/(api/v1/admin|app) {
        return 403 '{"error":{"message":"Access Denied: Control Plane management endpoints are restricted to the private management domain.","type":"security_error","code":"forbidden_domain"}}\n';
        add_header Content-Type application/json;
    }

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 50MB gateway limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    # Data Plane Inference Endpoints (/v1/chat/completions, /v1/models, /v1/messages, etc.)
    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        # Disable buffering for real-time SSE streaming tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ============================================================================
# 2. Dedicated Control Plane Virtual Host (Web App & Admin API Only)
# Host domain: console.airoute.internal, admin.airoute.internal, ~(console|admin)\..+
# Can be restricted to Corporate VPN / Intranet IP allowlist
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name console.airoute.internal admin.airoute.internal ~^(console|admin)\..+$;

    # Redirect root to Web App
    location = / {
        return 302 /app/;
    }

    # Edge-Accelerated Skill Bundle Downloads (Offloads backend Go cluster)
    location ~ ^/api/v1/skills/.+/download$ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_cache gateway_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 304 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        sendfile on;
        tcp_nopush on;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ============================================================================
# 3. Default Catch-All Virtual Host (Localhost / IP Access)
# Enables seamless evaluation on direct IP or localhost.
#
# This vhost intentionally serves the console and /api/v1/admin as well, so that
# http://127.0.0.1:8080 and direct-IP access keep working. Do not treat the
# absence of an api.* Host header as a security decision - see the control-plane
# exposure note near the top of this file.
# ============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 50MB gateway limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    # D15: control-plane paths are restricted to loopback/private clients at the
    # edge as well. This is defence in depth - the gateway enforces the same
    # policy behind the proxy (GATEWAY_ADMIN_ALLOWED_IPS / host allowlist), so a
    # different Host header can no longer bypass it.
    location ~ ^/(api/v1/admin|app)(/|$) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        allow fd00::/8;
        deny all;

        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Edge-Accelerated Skill Bundle Downloads (Offloads backend Go cluster)
    location ~ ^/api/v1/skills/.+/download$ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        proxy_cache gateway_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 304 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        sendfile on;
        tcp_nopush on;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;

        # Disable buffering to preserve zero-latency streaming SSE chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
