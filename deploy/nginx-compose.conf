# ============================================================================
# High-Availability Gateway Cluster Upstream
# ============================================================================
upstream gateway_cluster {
    least_conn;
    server gateway-1:8080 max_fails=2 fail_timeout=10s;
    server gateway-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 256;
}

# ============================================================================
# 1. Dedicated Data Plane Virtual Host (Inference API Only)
# Host domain: api.nano.internal, api.*
# Strictly blocks all /api/v1/admin/* and /ui/ endpoints from external clients
# ============================================================================
server {
    listen 80;
    server_name api.nano.internal ~^api\..+$;

    # Security Barrier: Block Control Plane endpoints from the inference domain
    location ~* ^/(api/v1/admin|ui) {
        return 403 '{"error":{"message":"Access Denied: Control Plane management endpoints are restricted to the private management domain.","type":"security_error","code":"forbidden_domain"}}\n';
        add_header Content-Type application/json;
    }

    # Data Plane Inference Endpoints (/v1/chat/completions, /v1/models, /v1/messages, etc.)
    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering for real-time SSE streaming tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ============================================================================
# 2. Dedicated Control Plane Virtual Host (Console & Admin API Only)
# Host domain: console.nano.internal, admin.nano.internal, ~(console|admin)\..+
# Can be restricted to Corporate VPN / Intranet IP allowlist
# ============================================================================
server {
    listen 80;
    server_name console.nano.internal admin.nano.internal ~^(console|admin)\..+$;

    # Redirect root to Web UI
    location = / {
        return 302 /ui/;
    }

    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# ============================================================================
# 3. Default Catch-All Virtual Host (Localhost / IP Access)
# Enables seamless evaluation on direct IP or localhost
# ============================================================================
server {
    listen 80 default_server;
    server_name localhost _;

    location / {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering to preserve zero-latency streaming SSE chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
