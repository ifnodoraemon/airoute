upstream airoute_cluster {
    least_conn;
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;

    keepalive 256;
}

# Request body limits for large prompts, multimodal vision, and audio payloads.
# Must not be smaller than the gateway's GATEWAY_MAX_BODY_BYTES (64 MiB).
client_max_body_size 64m;
client_body_buffer_size 10m;
client_body_timeout 30s;

server {
    listen 80;
    server_name _;

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 64MB edge proxy limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    # D15: control-plane paths are restricted to loopback/private clients at the
    # edge as well (defence in depth - the gateway enforces the same policy). This
    # single-vhost deployment has no Host-based split, so the ACL has to live on the
    # path itself; without it this file had no management boundary at all.
    location ~ ^/(api/v1/admin|app)(/|$) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        allow fd00::/8;
        deny all;

        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering to preserve zero-latency streaming SSE chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
