upstream airoute_cluster {
    least_conn;
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;

    keepalive 256;
}

# Request body limits for large prompts, multimodal vision, and audio payloads
client_max_body_size 50m;
client_body_buffer_size 10m;
client_body_timeout 30s;

server {
    listen 80;
    server_name _;

    # OpenAI-compatible JSON error response for 413 Payload Too Large
    error_page 413 = @error413;
    location @error413 {
        default_type application/json;
        return 413 '{"error":{"message":"Request entity too large: payload exceeds 50MB gateway limit.","type":"invalid_request_error","code":"payload_too_large"}}\n';
    }

    location / {
        proxy_pass http://airoute_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering to preserve zero-latency streaming SSE chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
